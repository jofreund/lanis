name: CI

on:
  pull_request:
  push:

jobs:
  laniskit:
    name: LanisKit build & test
    # LanisKit targets macOS 26; the runner image must be macOS 26 or newer.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build

      # LANIS_LIVE is unset, so LiveTests stay disabled and no credentials are needed.
      - name: Test
        run: swift test
